[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openroboassure"
version = "1.0.0"
description = "Simulation-only assurance pipeline for physical AI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "OpenRoboAssure contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "gymnasium>=1.1,<2",
    "mujoco>=3.2,<4",
    "optuna>=4.4,<5",
    "pybullet>=3.2,<4",
    "PyYAML>=6.0,<7",
    "SALib>=1.5,<2",
]

[project.scripts]
ora = "openroboassure.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pre-commit>=4.1,<5",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel.force-include]
"assets/imported/mujoco_menagerie" = "openroboassure/assets/mujoco_menagerie"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
 module = ["mujoco", "pybullet"]
ignore_missing_imports = true
