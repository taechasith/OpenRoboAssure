approval_id: GATE-P06-BASELINES
project_version: 0.6.0
decision: approved
approved_by: taechasith
approved_at: "2026-07-26T17:09:27+07:00"
approval_source: user_conversation
scope:
  task: pick_place_v1
  robot_scope:
    trained_task_adapter: ORA-4A
    model_probes_only: [Panda, UR5e]
  systems:
    A: no_randomization
    B: independent_broad_uniform_p05_variables
    C: automatic_curriculum
    D: morris_sobol_guided_randomization
  policy:
    observation: state_only
    architecture: mlp
    hidden_layers: [64, 64]
    shared_constraints:
      - identical_reward
      - identical_canonical_action_limits
      - identical_stopping_condition
      - no_method_specific_hyperparameter_tuning
  training:
    seeds_per_system: 5
    environment_steps_per_seed: 100000
    total_environment_steps: 2000000
    failed_seeds: retained_and_reported
  evaluation:
    held_out_scenarios_per_policy_seed: 200
    total_evaluation_episodes: 4000
    scenario_source: p05_evaluation_split
  sensitivity:
    variables: all_16_p05_variables
    morris:
      trajectories: 20
      evaluations: 340
      sobol_advance_threshold: "mu_star >= 5 percent of maximum mu_star"
    sobol:
      maximum_screened_variables: 6
      base_sample_size: 512
      second_order: disabled
      evaluations_at_maximum_dimension: 4096
      bootstrap_resamples: 1000
      retain_rule: "Sobol total-order 95 percent lower confidence bound > 0.01; retain at least the top 3 variables"
  metrics:
    primary: held_out_task_success
    secondary:
      - drop_rate
      - collision_rate
      - completion_steps
      - invalid_scenario_rate
      - fifth_percentile_scenario_family_success
  dependencies:
    requirement: "Every added dependency must pass the P02 licence audit before use."
    licence_exceptions: none
expires_when:
  - task_or_robot_training_scope_changes
  - baseline_definition_changes
  - training_or_evaluation_budget_changes
  - policy_architecture_or_shared_constraint_changes
  - sensitivity_threshold_or_selection_rule_changes
  - primary_metric_changes
notes: >-
  The project owner selected the CPU-standard baseline campaign. The approved
  two-million-step total is four systems times five seeds times one hundred
  thousand environment steps; it is not a budget for new robot task adapters.
  Panda and UR5e remain model probes until separately approved task adapters
  exist. The campaign is intentionally fixed and comparable: failed seeds are
  evidence, and no system receives method-specific tuning.
